name: t5

services:
  t5d:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      T5_ADDR: ":8080"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 20s
      timeout: 4s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  mysql:
    image: mysql:8.4
    profiles: ["bundled-db"]
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-t5}
      MYSQL_USER: ${MYSQL_USER:-t5}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Deliberately no ports: the database is reachable only on the private
    # Compose network (or an existing private MySQL network).
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      T5_DOMAIN: ${T5_DOMAIN:?set T5_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      t5d:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
